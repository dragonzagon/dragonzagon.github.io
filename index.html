<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragón Zagón: Microeditorial</title>
  <meta name="description" content="Dragón Zagón, microeditorial en Medellín.">
  <link rel="icon" href="art/huella-dragon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3ecdf;
      --ink: #1a1814;
      --clay: #7c3d32;
      --muted: #5c5348;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "EB Garamond", Palatino, "Palatino Linotype", Georgia, serif;
    }

    main {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(16rem, 24rem) minmax(16rem, 1fr);
      column-gap: clamp(1.5rem, 5vw, 4.5rem);
      align-items: center;
      padding: clamp(1.75rem, 4vw, 3.5rem);
      padding-right: clamp(0.75rem, 2vw, 2rem);
    }

    .mark {
      width: 4.25rem;
      height: auto;
      display: block;
    }

    h1 {
      margin: 1.15rem 0 0;
      font-weight: 500;
      font-size: clamp(3.6rem, 8vw, 5.6rem);
      line-height: 0.86;
      letter-spacing: -0.03em;
    }

    .role {
      margin: 0.85rem 0 0;
      font-style: italic;
      font-weight: 500;
      font-size: 1.65rem;
      color: var(--clay);
    }

    .lead {
      margin: 1.75rem 0 0;
      font-size: 1.45rem;
      line-height: 1.3;
      color: var(--muted);
    }

    .dragon {
      justify-self: end;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100dvh - 4rem);
    }

    @media (max-width: 760px) {
      html, body { height: auto; overflow: auto; }

      main {
        grid-template-columns: 1fr;
        align-items: start;
        row-gap: 1.5rem;
        padding-right: clamp(1.25rem, 4vw, 2rem);
      }

      .dragon {
        justify-self: center;
        width: auto;
        max-width: 100%;
        max-height: calc(100dvh - 25.5rem);
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="mark" src="art/huella-dragon.svg" alt="">
      <h1>Dragón<br>Zagón</h1>
      <p class="role">Microeditorial</p>
      <p class="lead">Una casa pequeña para libros,<br>en Medellín.</p>
    </header>
    <img class="dragon" src="img/dragon.webp" alt="Dragón con anteojos, leyendo un libro abierto.">
  </main>
</body>
</html>
